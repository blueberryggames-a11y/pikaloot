<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unlock File — Pika.Solutions</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="noise"></div>

  <nav>
    <a href="../index.html" class="logo">pika<span>.</span>solutions</a>
  </nav>

  <div class="unlock-wrap">
    <div class="unlock-card" id="unlockCard">
      <div class="file-icon">📦</div>
      <h2 id="fileName">Loading file...</h2>
      <p class="file-meta" id="fileMeta">—</p>

      <div class="lock-notice">
        <p>🔒 This file is locked. Complete <strong>one quick task</strong> below to unlock your download. The uploader earns a small reward — it only takes 30 seconds!</p>
      </div>

      <div id="cpaLockerContainer">
        <script type="text/javascript">var lck = false;</script>
        <script type="text/javascript" src="https://getafilenow.com/script_include.php?id=1895074"></script>
        <script type="text/javascript">if(!lck){top.location = 'https://getafilenow.com/help/ablk.php?lkt=1'; }</script>
      </div>

      <button class="unlock-btn" id="downloadBtn" disabled onclick="downloadFile()">
        🔒 Complete a task to unlock
      </button>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 🔥 Same config
    const firebaseConfig = {
      apiKey: "AIzaSyByjLaBDMcBlJKpIEa0hR8yHFRRQFP4OBw",
      authDomain: "loot-baaca.firebaseapp.com",
      projectId: "loot-baaca",
      storageBucket: "loot-baaca.firebasestorage.app",
      messagingSenderId: "675901440162",
      appId: "1:675901440162:web:600ea691407c5ee3a197fb",
      measurementId: "G-NMTE7MR76Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const fileDocId = params.get('id');

    let fileData = null;
    let unlocked = false;

    async function loadFile() {
      if (!fileDocId) {
        document.getElementById('fileName').textContent = 'Invalid link';
        return;
      }
      const snap = await getDoc(doc(db, 'files', fileDocId));
      if (!snap.exists()) {
        document.getElementById('fileName').textContent = 'File not found';
        return;
      }
      fileData = snap.data();
      document.getElementById('fileName').textContent = fileData.fileName;
      document.title = `${fileData.fileName} — Pika.Solutions`;
      const sizeLabel = fileData.fileSize > 1048576
        ? (fileData.fileSize / 1048576).toFixed(1) + ' MB'
        : (fileData.fileSize / 1024).toFixed(0) + ' KB';
      document.getElementById('fileMeta').textContent = `${sizeLabel} · ${fileData.unlocks || 0} unlocks`;
    }

    window.simulateTaskComplete = function() {
      unlocked = true;
      const btn = document.getElementById('downloadBtn');
      btn.disabled = false;
      btn.textContent = '⬇️ Download File';
    };

    const WORKER = "https://wispy-thunder-5d7d.xxgoldenwarriors.workers.dev";

    window.downloadFile = async function() {
      if (!unlocked || !fileData) return;
      // Increment unlock count
      await updateDoc(doc(db, 'files', fileDocId), { unlocks: increment(1) });
      // Route download through Cloudflare Worker to avoid CORS
      let dlUrl = fileData.downloadURL;
      if (dlUrl.includes('firebasestorage.googleapis.com')) {
        dlUrl = dlUrl.replace('https://firebasestorage.googleapis.com', WORKER);
      }
      window.open(dlUrl, '_blank');
    };

    // Called by your real CPA locker on task completion
    // Most lockers let you set a JS callback — point it here
    window.cpaLockerUnlocked = function() {
      window.simulateTaskComplete();
    };

    loadFile();
  </script>
</body>
</html>
